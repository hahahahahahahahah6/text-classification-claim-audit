[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "text-classification-claim-audit"
version = "0.1.0"
description = "Offline documentation evidence auditor"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.scripts]
text-classification-claim-audit = "text_classification_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["text_classification_claim_audit*", "tests"]
